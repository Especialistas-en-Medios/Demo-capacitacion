<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Ejemplo | Template</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="../style.css">
</head>

<body class="p-3 p-md-5">

  <div class="container">
    <div class="row justify-content-center">

      <!-- INICIO DE TU TARJETA DE PERFIL-->
      <div class="col-12 col-md-6 col-lg-4 profile-card-wrapper">
        <div class="card profile-card">

          <!-- Banner superior decorativo -->
          <div class="profile-card-header"></div>

          <div class="card-body text-center pt-0">
            <!-- 1. FOTO O AVATAR -->
            <!-- Puedes usar una URL directa de tu foto o un avatar generado por https://ui-avatars.com -->
            <div class="profile-avatar-container mb-3">
              <img src="https://ui-avatars.com/api/?name=JCMM&background=0d6efd&color=fff&size=128"
                alt="Foto de perfil" class="profile-avatar">
            </div>

            <!-- 2. NOMBRE COMPLETO -->
            <h5 class="card-title fw-bold mb-1">Juan Carlos Mandri</h5>

            <!-- 3. ROL / PUESTO -->
            <p class="text-primary fw-semibold small mb-2">Desarrollador web</p>

            <!-- 4. DESCRIPCIÓN O FRASE CORTA -->
            <p class="card-text text-muted small px-2 mb-3">
              Especialista meterme en problemas.
            </p>

            <!-- 5. HABILIDADES / TECNOLOGÍAS (Agrega o cambia las que gustes) -->
            <div class="mb-3">
              <span class="tech-badge">C#</span>
              <span class="tech-badge">.NET</span>
              <span class="tech-badge">MySQL Server</span>
              <span class="tech-badge">Git</span>
            </div>
            <!-- 6. REDES SOCIALES O CONTACTO -->
            <!--  
            <div class="social-links d-flex justify-content-center gap-2">
              <a href="https://github.com" target="_blank" title="GitHub" aria-label="GitHub">
                <i class="bi bi-github"></i>
              </a>
              <a href="https://linkedin.com" target="_blank" title="LinkedIn" aria-label="LinkedIn">
                <i class="bi bi-linkedin"></i>
              </a>
              <a href="mailto:tu-correo@empresa.com" title="Correo" aria-label="Correo">
                <i class="bi bi-envelope"></i>
              </a>
            </div>

          </div> -->

            <!-- Pie de tarjeta opcional: fecha o equipo -->
            <div class="card-footer bg-transparent border-0 text-center pb-3">
              <span class="badge bg-light text-secondary border small">Demo Capacitación 2026</span>
            </div>

          </div>
        </div>
        <!-- FIN DE TU TARJETA DE PERFIL -->

      </div>
    </div>

</body>

</html>
